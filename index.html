<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#041a2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="つりパーク">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>南予つりパーク</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#041a2c;touch-action:none;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;color:#fff}
  #safe{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);visibility:hidden;pointer-events:none}
  #wrap{position:fixed;left:50%;top:50%;width:720px;height:1280px;transform-origin:center center;overflow:hidden}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hidden{display:none!important}
  button{font:inherit;color:#fff;cursor:pointer;pointer-events:auto;touch-action:manipulation;border:none;background:none}
  .outline{text-shadow:0 0 2px #04223a,3px 0 0 #04223a,-3px 0 0 #04223a,0 3px 0 #04223a,0 -3px 0 #04223a,2px 2px 0 #04223a,-2px -2px 0 #04223a,2px -2px 0 #04223a,-2px 2px 0 #04223a,0 7px 10px rgba(0,0,0,.45)}

  /* ボタン */
  .btn{display:block;width:100%;font-size:44px;font-weight:900;padding:24px 18px;border-radius:32px;border:5px solid rgba(255,255,255,.92);background:linear-gradient(#ffb43a,#ff7a00);box-shadow:0 10px 0 #b04c00,0 16px 24px rgba(0,0,0,.35);text-shadow:0 3px 0 rgba(0,0,0,.25);letter-spacing:2px}
  a.btn{color:#fff;text-align:center;-webkit-tap-highlight-color:transparent}
  .btn:active{transform:translateY(8px);box-shadow:0 2px 0 #b04c00,0 6px 10px rgba(0,0,0,.3)}
  .btn.blue{background:linear-gradient(#4fc3ff,#1a7fe0);box-shadow:0 10px 0 #0d4f9a,0 16px 24px rgba(0,0,0,.35)}
  .btn.blue:active{box-shadow:0 2px 0 #0d4f9a}
  .btn.green{background:linear-gradient(#6ee07a,#24a83a);box-shadow:0 10px 0 #136b22,0 16px 24px rgba(0,0,0,.35)}
  .btn.green:active{box-shadow:0 2px 0 #136b22}
  .btn.pink{background:linear-gradient(#ff8ac2,#e8408a);box-shadow:0 10px 0 #9a2058,0 16px 24px rgba(0,0,0,.35)}
  .btn.pink:active{box-shadow:0 2px 0 #9a2058}
  .btn.gray{background:linear-gradient(#9aaec0,#5f7488);box-shadow:0 10px 0 #3a4b5c,0 16px 24px rgba(0,0,0,.35)}
  .btn.gray:active{box-shadow:0 2px 0 #3a4b5c}
  .btn.sm{font-size:30px;padding:16px 10px;border-radius:24px}
  .btn:disabled{filter:grayscale(.85) brightness(.75)}
  .sbtn{flex:none;font-size:34px;font-weight:900;width:88px;height:78px;border-radius:22px;border:4px solid rgba(255,255,255,.92);background:linear-gradient(#4fc3ff,#1a7fe0);box-shadow:0 6px 0 #0d4f9a;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .sbtn:active{transform:translateY(5px);box-shadow:0 1px 0 #0d4f9a}
  .sbtn:disabled{filter:grayscale(.9) brightness(.7)}
  .coin{display:inline-block;flex:none;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffbe0,#ffd84a 38%,#e09a10 72%,#9a6200);border:3px solid #fff0a0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  .coin.sm{width:30px;height:30px;border-width:2px}

  /* 上のバー */
  #topbar{position:absolute;left:0;right:0;top:0;height:104px;display:flex;align-items:center;gap:12px;padding:16px 16px 0;z-index:6;pointer-events:none}
  #topTitle{flex:1;font-size:32px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #medalBox{display:flex;align-items:center;gap:10px;padding:6px 22px 6px 8px;border-radius:40px;background:rgba(0,0,0,.55);border:3px solid #ffd54a;font-size:40px;font-weight:900;color:#ffe680;min-width:220px;justify-content:space-between}

  /* 画面 */
  .screen{position:absolute;inset:0;display:none;pointer-events:none}
  .screen.on{display:block}
  .screen.dim{background:linear-gradient(rgba(2,14,26,.3),rgba(2,14,26,.72))}
  .screen.dim.on{pointer-events:auto}
  .page{position:absolute;left:36px;right:36px;top:130px;bottom:40px;display:flex;flex-direction:column;gap:26px}
  .head{font-size:46px;font-weight:900;text-align:center}

  /* タイトル */
  #scTitle{pointer-events:auto}
  .logo{position:absolute;left:0;right:0;top:260px;text-align:center}
  .logo1{font-size:64px;font-weight:900;color:#fff}
  .logo2{font-size:118px;font-weight:900;line-height:1.05;color:#ffd84a;text-shadow:0 0 0 #0b2f55,5px 0 0 #0b2f55,-5px 0 0 #0b2f55,0 5px 0 #0b2f55,0 -5px 0 #0b2f55,4px 4px 0 #0b2f55,-4px -4px 0 #0b2f55,4px -4px 0 #0b2f55,-4px 4px 0 #0b2f55,0 12px 0 #0b2f55,0 18px 22px rgba(0,0,0,.45)}
  .logo3{font-size:30px;font-weight:900;margin-top:22px;color:#bff0ff}
  #tapStart{position:absolute;left:0;right:0;top:880px;text-align:center;font-size:44px;font-weight:900;animation:blink 1.2s infinite}
  #scEnd .page{justify-content:center;text-align:center}
  #endTitle{font-size:64px;font-weight:900;color:#ffe14a}
  #endStats{font-size:34px;line-height:1.8;font-weight:900}
  #endNote{font-size:28px;line-height:1.7;opacity:.95}
  #goInstall{font-size:26px;white-space:nowrap;padding-left:4px;padding-right:4px;letter-spacing:0}
  #titleInstall{position:absolute;left:120px;right:120px;top:1010px;width:auto}
  #landNote{position:absolute;left:0;right:0;bottom:60px;text-align:center;font-size:26px;opacity:.85}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ホーム */
  #homeLogo{text-align:center;margin:10px 0 14px}
  #homeLogo .logo2{font-size:92px}
  .row2{display:flex;gap:18px}
  #stats{font-size:26px;text-align:center;line-height:1.6;opacity:.9}

  /* ステージ・ショップのカード */
  .list{display:flex;flex-direction:column;gap:20px}
  .sc{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:26px;border:4px solid rgba(255,255,255,.85);background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.06));box-shadow:0 8px 0 rgba(0,0,0,.25);text-align:left;width:100%;pointer-events:auto}
  .sc:active{transform:translateY(5px)}
  .sc .ic{flex:none;width:104px;height:104px;border-radius:20px;border:3px solid rgba(255,255,255,.8);overflow:hidden}
  .sc .tx{flex:1}
  .sc .nm{font-size:36px;font-weight:900}
  .sc .ds{font-size:24px;opacity:.9;margin-top:4px;line-height:1.35}
  .sc .pr{flex:none;font-size:30px;font-weight:900;text-align:center;min-width:150px}
  .sc.locked{filter:brightness(.8)}
  #scStage .page{overflow-y:auto;touch-action:pan-y}
  #stageList{gap:12px}
  #stageList .sc{padding:10px 16px}
  #stageList .sc .nm{font-size:33px}
  #stageList .sc .ds{font-size:21px;line-height:1.3}
  #stageList .tag{font-size:20px;margin-top:4px}
  #scStage .page{top:118px}
  .tag.hard{background:#ff3a5a;color:#fff}
  .tag{display:inline-block;font-size:22px;font-weight:900;padding:3px 12px;border-radius:12px;background:#ffd23a;color:#5a3500;margin-top:6px}
  .lv{font-size:26px;font-weight:900;color:#ffe680}

  /* 図鑑 */
  #bookTabs{display:flex;gap:8px}
  #bookTabs button{flex:1;font-size:24px;font-weight:900;padding:14px 0;border-radius:18px;border:3px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12)}
  #bookTabs button.on{background:linear-gradient(#ffb43a,#ff7a00);border-color:#fff}
  #bookComp{font-size:30px;font-weight:900;text-align:center}
  #bookGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:1;min-height:0;overflow-y:auto;align-content:start;touch-action:pan-y;padding-bottom:10px}
  .bk{border-radius:20px;border:3px solid rgba(255,255,255,.6);background:rgba(255,255,255,.1);padding:8px 8px 10px;text-align:center;pointer-events:auto}
  .bk canvas{width:100%;height:auto;display:block}
  .bk .st{font-size:18px;color:#ffd23a;letter-spacing:1px}
  .bk .nm{font-size:21px;font-weight:900;line-height:1.2;overflow-wrap:anywhere}

  /* 釣り画面 */
  #feverBar{position:absolute;left:16px;top:112px;font-size:34px;font-weight:900;color:#ffe14a;animation:rainbow 1s linear infinite}
  @keyframes rainbow{0%{color:#ffe14a}33%{color:#ff7ad0}66%{color:#7af0ff}100%{color:#ffe14a}}
  #fightTop{position:absolute;right:16px;top:112px;width:400px;padding:12px 16px 14px;border-radius:22px;background:rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.7)}
  #fLabel{font-size:30px;font-weight:900;display:flex;gap:10px;align-items:baseline;white-space:nowrap;overflow:hidden}
  #fStars{color:#ffd23a;font-size:26px;letter-spacing:1px}
  .gauge{position:relative;height:30px;border-radius:15px;background:rgba(0,0,0,.55);border:3px solid #fff;overflow:hidden;margin-top:8px}
  .gauge>div{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:12px}
  .gauge.time{height:14px;border-width:2px}
  #hpFill{background:linear-gradient(#ff9a9a,#e8303a)}
  #timeFill{background:#7fd8ff}
  #hint{position:absolute;left:20px;right:20px;bottom:206px;text-align:center;font-size:32px;font-weight:900}
  #hint.f{bottom:292px}
  #aimBottom{position:absolute;left:16px;right:16px;bottom:22px;height:160px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:30px;background:rgba(0,0,0,.5);border:4px solid rgba(255,255,255,.75)}
  #rodCard{flex:1;text-align:center}
  #rodName{font-size:40px;font-weight:900}
  #rodSub{display:flex;align-items:center;justify-content:center;gap:8px;font-size:32px;font-weight:900;color:#ffe680}
  #rodTarget{font-size:24px;opacity:.95;margin-top:2px}
  #fightBottom{position:absolute;left:16px;right:16px;bottom:22px;height:250px}
  #tenRow{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;font-size:28px;font-weight:900}
  #tenRow .gauge{flex:1;margin:0;height:34px}
  #tenFill{width:0;background:#4cd07d}
  #tapPad{position:absolute;left:0;right:200px;bottom:0;height:170px;border-radius:85px;border:5px dashed rgba(255,255,255,.75);background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;pointer-events:none}
  #tapPad.pulse{animation:pulse .35s infinite alternate}
  @keyframes pulse{to{transform:scale(1.04);background:rgba(255,220,80,.25)}}
  #btnSkill{position:absolute;right:0;bottom:0;width:180px;height:180px;border-radius:50%;border:6px solid #fff;background:#3a2a6a;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.35)}
  #btnSkill span{position:relative;font-size:42px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.4)}
  #skillFill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#ffe56a,#ff9a1a)}
  #btnSkill.ready{animation:glow .5s infinite alternate}
  @keyframes glow{to{box-shadow:0 0 30px 10px #ffd23a,0 8px 0 rgba(0,0,0,.35);transform:scale(1.06)}}
  #banner{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:96px;font-weight:900;pointer-events:none;opacity:0;z-index:7;line-height:1.1}
  #banner.show{animation:pop .9s ease-out forwards}
  #banner.gold{color:#ffe14a}
  #banner.red{color:#ff6a6a}
  #banner.blue{color:#8fe8ff}
  @keyframes pop{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.15)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}

  /* ポップアップ */
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,10,20,.6);pointer-events:auto;z-index:9}
  .card{width:640px;padding:34px 36px 38px;border-radius:40px;border:6px solid #fff;background:linear-gradient(#16507e,#0b2f4f);box-shadow:0 14px 0 rgba(0,0,0,.3),0 30px 60px rgba(0,0,0,.5);text-align:center}
  .card .btns{display:flex;gap:18px;margin-top:28px}
  #rBig{font-size:54px;font-weight:900;color:#ffe14a;min-height:10px}
  #rStars,#dStars{font-size:44px;color:#ffd23a;letter-spacing:4px}
  #rName,#dName{font-size:56px;font-weight:900}
  #rSize{font-size:32px;margin-top:6px}
  #rNew{font-size:32px;font-weight:900;color:#7affb0;min-height:42px;margin-top:6px}
  #rPay{display:flex;align-items:center;justify-content:center;gap:12px;font-size:64px;font-weight:900;color:#ffe680;margin-top:6px}
  #rFever{font-size:28px;color:#ff9ad8;font-weight:900;min-height:10px}
  #dDesc{font-size:28px;line-height:1.55;margin-top:12px;text-align:left}
  #dRec{font-size:28px;margin-top:14px;color:#ffe680;font-weight:900}
  #dlgText{font-size:36px;font-weight:900;line-height:1.5}
  /* 遊び方 */
  .card.help{position:relative;padding:26px 30px 30px}
  #hTitle{font-size:38px;font-weight:900;color:#ffe14a;margin:4px 56px 16px;white-space:nowrap}
  #hCv{width:560px;height:280px;display:block;margin:0 auto;border-radius:24px}
  #hText{font-size:29px;line-height:1.6;text-align:left;margin-top:18px;min-height:300px}
  #hText b{color:#ffe680}
  #hText .red{color:#ff8a8a;font-weight:900}
  #hText .gold{color:#ffe14a;font-weight:900}
  #hText small{font-size:24px;opacity:.85}
  #hDots{display:flex;gap:14px;justify-content:center;margin-top:10px}
  #hDots span{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3)}
  #hDots span.on{background:#ffd23a}
  .card.help .btns .btn{font-size:36px;padding:22px 10px;white-space:nowrap}
  /* インストール案内 */
  #iIcon{width:150px;height:150px;border-radius:34px;border:4px solid #fff;display:block;margin:0 auto 10px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
  #iTitle{font-size:40px;font-weight:900;color:#ffe14a;margin-bottom:10px}
  .steps{display:flex;flex-direction:column;gap:16px;text-align:left;margin-top:8px}
  .step{display:flex;gap:16px;align-items:center;font-size:30px;line-height:1.45;padding:14px 16px;border-radius:22px;background:rgba(255,255,255,.1)}
  .step b{color:#ffe680}
  .step .num{flex:none;width:56px;height:56px;border-radius:50%;background:#ff8a1a;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900}
  .step svg{vertical-align:middle}
  .inote{font-size:26px;line-height:1.6;margin-top:16px;text-align:left}
  .inote.warn{color:#ffd0a0;font-size:24px}
  #hClose,#iClose{position:absolute;right:18px;top:16px;width:66px;height:66px;border-radius:50%;font-size:34px;font-weight:900;background:rgba(255,255,255,.15);border:3px solid rgba(255,255,255,.75)}
  #turnNote{position:fixed;left:0;right:0;bottom:0;padding:8px;text-align:center;font-size:14px;background:rgba(0,0,0,.75);z-index:20;display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <!-- タイトル -->
  <div id="scTitle" class="screen dim on">
    <div class="logo">
      <div class="logo1 outline">南予</div>
      <div class="logo2">つりパーク</div>
      <div class="logo3 outline">〜 宇和海アーケードフィッシング 〜</div>
    </div>
    <div id="tapStart" class="outline">タップしてスタート</div>
    <button id="titleInstall" class="btn green sm hidden">📲 アプリとしてインストール</button>
    <div id="landNote" class="outline">スマホは縦向きで遊んでね</div>
  </div>

  <!-- ホーム -->
  <div id="scHome" class="screen dim">
    <div class="page">
      <div id="homeLogo"><span class="logo2">つりパーク</span></div>
      <button class="btn" id="goStage">🎣 釣りに行く</button>
      <button class="btn green" id="goShop">🛒 ショップ</button>
      <button class="btn pink" id="goBook">📖 魚図鑑 <span id="bookCnt"></span></button>
      <button class="btn blue" id="goHelp">❓ 遊び方</button>
      <div class="row2"><button class="btn blue sm" id="tgBgm">BGM</button><button class="btn blue sm" id="tgSe">効果音</button></div>
      <div class="row2"><button class="btn green sm hidden" id="goInstall">📲 インストール</button><button class="btn gray sm" id="goQuit">🚪 ゲーム終了</button></div>
      <div id="stats" class="outline"></div>
    </div>
  </div>

  <!-- 終了画面 -->
  <div id="scEnd" class="screen dim">
    <div class="page">
      <div id="endTitle" class="outline">おつかれさまでした！</div>
      <div id="endStats" class="outline"></div>
      <div id="endNote" class="outline">記録は自動で保存されました。<br>このままスマホのホーム画面に戻れば終了です。<br>次に開いたときは続きから遊べます。</div>
      <button class="btn" id="goAgain">🎣 もう一度あそぶ</button>
    </div>
  </div>

  <!-- 釣り場えらび -->
  <div id="scStage" class="screen dim">
    <div class="page"><div class="list" id="stageList"></div></div>
  </div>

  <!-- ショップ -->
  <div id="scShop" class="screen dim">
    <div class="page">
      <div class="head outline">道具を強くしよう</div>
      <div class="list" id="shopList"></div>
    </div>
  </div>

  <!-- 図鑑 -->
  <div id="scBook" class="screen dim">
    <div class="page">
      <div id="bookTabs"></div>
      <div id="bookComp" class="outline"></div>
      <div id="bookGrid"></div>
    </div>
  </div>

  <!-- 釣り -->
  <div id="scFish" class="screen">
    <div id="feverBar" class="outline hidden">FEVER <span id="feverT">30</span></div>
    <div id="fightTop" class="hidden">
      <div id="fLabel" class="outline"><span id="fStars"></span><span id="fName"></span></div>
      <div class="gauge"><div id="hpFill"></div></div>
      <div class="gauge time"><div id="timeFill"></div></div>
    </div>
    <div id="hint" class="outline"></div>
    <div id="aimBottom">
      <button id="rodPrev" class="sbtn">◀</button>
      <div id="rodCard">
        <div id="rodName" class="outline"></div>
        <div id="rodSub"><span class="coin sm"></span><span id="rodCost"></span></div>
        <div id="rodTarget"></div>
      </div>
      <button id="rodNext" class="sbtn">▶</button>
    </div>
    <div id="fightBottom" class="hidden">
      <div id="tenRow"><span class="outline">テンション</span><div class="gauge"><div id="tenFill"></div></div></div>
      <div id="tapPad" class="outline">連打！！</div>
      <button id="btnSkill"><div id="skillFill"></div><span>必殺</span></button>
    </div>
  </div>

  <div id="topbar">
    <button id="btnBack" class="sbtn">◀</button>
    <div id="topTitle" class="outline"></div>
    <button id="btnHelp" class="sbtn hidden">？</button>
    <div id="medalBox"><span class="coin"></span><span id="medalNum">0</span></div>
  </div>
  <div id="banner" class="outline"></div>

  <!-- 釣果 -->
  <div id="result" class="ov hidden">
    <div class="card">
      <div id="rBig" class="outline"></div>
      <canvas id="rCv" width="560" height="300" style="width:560px;height:300px"></canvas>
      <div id="rStars" class="outline"></div>
      <div id="rName" class="outline"></div>
      <div id="rSize"></div>
      <div id="rNew"></div>
      <div id="rPay" class="outline"><span class="coin"></span><span>+<span id="rPayNum">0</span></span></div>
      <div id="rFever"></div>
      <div class="btns"><button class="btn" id="rOk">OK！</button></div>
    </div>
  </div>
  <!-- 確認 -->
  <div id="dialog" class="ov hidden">
    <div class="card">
      <div id="dlgText"></div>
      <div class="btns"><button class="btn gray" id="dlgNo">やめる</button><button class="btn" id="dlgYes">OK</button></div>
    </div>
  </div>
  <!-- インストール案内 -->

function rollClass() {
  const d = RODS[save.rod].dist.slice();
  const shift = (save.up.lure - 1) * 0.04 + (fever > 0 ? 0.06 : 0) + (STAGES[stageIdx].hard ? 0.2 : 0);
  for (let c = 3; c >= 0; c--) { const m = d[c] * shift; d[c] -= m; d[c + 1] += m; }
  let r = Math.random() * d.reduce((a, b) => a + b, 0), cls = 1;
  for (let i = 0; i < 5; i++) { r -= d[i]; if (r <= 0) { cls = i + 1; break; } }
  if (cls === 5 && STAGES[stageIdx].hard && Math.random() < 0.35) cls = 6;  // 伝説の魚
  return cls;
}
// その釣り場に出る魚（ほかの釣り場の魚も含む）
const stageSpecies = (s, c) => SPECIES.filter(sp => (sp.s === s || sp.also.includes(s)) && (c == null || sp.c === c));

}

  const px = Math.min(520, PX[sp.c] * (0.85 + 0.3 * sizeT) * (SHAPE_MUL[sp.sh] || 1));
  const dir = opt.dir || (Math.random() < 0.5 ? 1 : -1);

  const y = opt.y != null ? clamp(opt.y + rand(-70, 70), TOPY, BOTY) : TOPY + rand(sp.d[0], sp.d[1]) * (BOTY - TOPY);

  return { sp, L, w: weightOf(sp, L), sizeT, px, x, y, baseY: y, dir, vx: dir * spd, spd, ph: rand(0, 6), seed: rand(0, 6), state: 'swim', delay: 0 };

const rodPower = () => RODS[save.rod].P * (1 + 0.15 * (save.up.reel - 1));
const rodLine = () => RODS[save.rod].L * (1 + 0.12 * (save.up.line - 1));
function updateFight(dt) {
  const fi = fight, f = hooked, ratio = fi.pow / rodLine(), hd = hard();
  fi.timer -= dt;
  if (fi.timer <= 0) return escape('時間切れ…逃げられた');
  fi.modeT -= dt;
  if (fi.mode === 'normal' && fi.modeT <= 0) { fi.mode = 'warn'; fi.modeT = 0.5; sfx.warn(); banner('あばれる！', 'red', 0.8); }
  else if (fi.mode === 'warn' && fi.modeT <= 0) { fi.mode = 'rage'; fi.modeT = (rand(0.9, 1.5) + f.sp.c * 0.15) * hd.rage; buzz(150); }
  else if (fi.mode === 'rage' && fi.modeT <= 0) {
    if (Math.random() < hd.chance) { fi.mode = 'chance'; fi.modeT = 1.6; banner('チャンス！', 'gold', 0.8); sfx.chance(); }
    else { fi.mode = 'normal'; fi.modeT = rand(1.8, 4) * hd.gap; }
  } else if (fi.mode === 'chance' && fi.modeT <= 0) { fi.mode = 'normal'; fi.modeT = rand(1.8, 4) * hd.gap; }

  fi.tension = clamp(fi.tension, 0, 120);
  if (fi.tension >= 100) return escape('ラインブレイク！', true);

  const prog = 1 - fi.hp / fi.hpMax;
  let tx = lerp(fi.hookX, 360, prog * 0.8), ty = lerp(fi.hookY, SURF + 70, prog);
  if (fi.mode === 'rage') { tx += Math.sin(T * 9) * 110; ty += 70; }
  else if (fi.mode === 'warn') tx += Math.sin(T * 45) * 8;
  else tx += Math.sin(T * 2.3) * 30;
  const k = Math.min(1, dt * (fi.mode === 'rage' ? 4 : 2.5));
  f.x += (tx - f.x) * k; f.y += (ty - f.y) * k;
  f.x = clamp(f.x, 40, W - 40); f.y = clamp(f.y, SURF + 40, BOTY);
  f.dir = fi.mode === 'rage' ? (Math.cos(T * 9) > 0 ? 1 : -1) : (f.x > rod.tip.x ? -1 : 1);
  f.ph += dt * (fi.mode === 'rage' ? 28 : 12);
  lure.x = f.x + f.dir * f.px * 0.5; lure.y = f.y;

// =====================================================================
//  更新
// =====================================================================
function update(dt) {
  T += dt;
  if (bgDirty) renderBG();
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt * 2);
  if (fever > 0 && screen === 'fish' && fstate !== 'result') { fever -= dt; if (fever <= 0) { fever = 0; banner('FEVER 終了', 'blue', 1); } }
  BGM.tempo = fstate === 'fight' && screen === 'fish' ? 140 : fever > 0 ? 136 : 116;
  computeRod();
  if (screen === 'fish') {
    stT += dt;
    switch (fstate) {
      case 'fly': {
        lure.t = Math.min(1, lure.t + dt / 0.45);
        lure.x = lerp(lure.sx, lure.tx, lure.t); lure.y = lerp(lure.sy, SURF, lure.t) - Math.sin(lure.t * Math.PI) * 140;
        if (lure.t >= 1) { lure.y = SURF; fstate = 'sink'; addSplash(lure.x, SURF, 0.4, true); sfx.splash(0.4); }
        break;
      }
      case 'sink':
        lure.y += 900 * dt;
        if (lure.y >= lure.ty) { lure.y = lure.ty; fstate = 'wait'; stT = 0; chooseTarget(); }
        break;
      case 'wait':
        if (!target || target.dead) { fstate = 'aim'; lure.show = false; }
        break;
      case 'hit':
        lure.x = target.x + target.dir * target.px * 0.5;
        if (stT > 0.75) startFight(false);
        break;
      case 'fight': updateFight(dt); break;
      case 'land': {
        const f = hooked;
        f.y += (SURF + 10 - f.y) * Math.min(1, dt * 8); f.x += (330 - f.x) * Math.min(1, dt * 4); f.ph += dt * 30;
        lure.x = f.x + f.dir * f.px * 0.5; lure.y = f.y;
        if (stT > 0.45) startJump();
        break;
      }
      case 'jump':
        jump.t += dt / 0.95;
        if (jump.t >= 1) showResult();
        break;
      case 'escape':
        if (stT > 1.3) fstate = 'aim';
        break;
    }
  }
  updateFishes(dt);
  updateEffects(dt);
  updateHUD();
}
function updateFishes(dt) {
  for (const f of fishes) {
    if (f.state === 'hooked') continue;
    f.ph += dt * (4 + Math.abs(f.vx) / 25);
    if (f.state === 'swim') {
      f.x += f.vx * dt; f.y = f.baseY + Math.sin(T * 0.8 + f.seed) * 12;
      if ((f.vx > 0 && f.x > W + f.px) || (f.vx < 0 && f.x < -f.px)) f.dead = true;
    } else if (f.state === 'approach') {
      const tx = lure.x - f.dir * f.px * 0.5, ty = lure.y;
      let gx = tx, gy = ty, spd = Math.max(240, f.spd * 2.5);
      if (f.delay > 0) {
        f.delay -= dt; gx = tx - f.dir * 80; spd = Math.max(140, f.spd * 1.5);
        if (Math.hypot(gx - f.x, gy - f.y) < 16) { f.x += Math.sin(T * 3 + f.seed) * 0.6; f.y += Math.cos(T * 2.3) * 0.5; continue; }
      }
      const dx = gx - f.x, dy = gy - f.y, d = Math.hypot(dx, dy) || 1, st = Math.min(d, spd * dt);
      f.x += dx / d * st; f.y += dy / d * st; f.vx = f.dir * spd;
      if (f.delay <= 0 && Math.hypot(tx - f.x, ty - f.y) < 10 && fstate === 'wait') bite();
    } else if (f.state === 'flee') {
      f.x += f.dir * 520 * dt; f.vx = f.dir * 520;
      if (f.x < -f.px * 1.5 || f.x > W + f.px * 1.5) f.dead = true;
    }
    if (f.state !== 'flee' && f.state !== 'approach' && Math.abs(f.vx) > 1) f.dir = Math.sign(f.vx);
  }
  fishes = fishes.filter(f => !f.dead);
  const want = 11 + (fever > 0 ? 5 : 0);
  const ambient = fishes.filter(f => f.state === 'swim').length;
  if (ambient < want && Math.random() < dt * 2) spawnAmbient(false);
}
function addSplash(x, y, s, ring) {
  for (let i = 0; i < 6 + s * 22; i++) particles.push({ x, y: Math.min(y, SURF), vx: rand(-80, 80) * (0.5 + s), vy: rand(-260, -60) * (0.6 + s), t: rand(0.5, 1), kind: 'drop' });
  if (ring) particles.push({ x, y: SURF, r: 6, t: 1, kind: 'ring', s });
}
function updateEffects(dt) {
  for (const p of particles) {
    p.t -= dt;
    if (p.kind === 'drop') { p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.y > SURF + 4) p.t = 0; }
    else if (p.kind === 'ring') p.r += dt * 60 * (1 + p.s);
    else if (p.kind === 'spark') { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 80 * dt; }
  }
  particles = particles.filter(p => p.t > 0);
  for (const n of nums) { n.t += dt; n.y -= dt * 70; }
  nums = nums.filter(n => n.t < 0.8);
  for (const c of coins) {
    c.t += dt;
    if (c.t < 0) continue;
    if (c.t < 0.35) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 1200 * dt; if (!c.sx) { c.sx = 1; } }
    else {
      if (c.sx === 1) { c.sx = c.x; c.sy = c.y; c.k = 0; }
      c.k = Math.min(1, c.k + dt * 2.6);
      const e = c.k * c.k;
      c.x = lerp(c.sx, c.tx, e); c.y = lerp(c.sy, c.ty, e) - Math.sin(c.k * Math.PI) * 80;
      if (c.k >= 1) { c.done = true; medalShown += c.v; sfx.coin(); }
    }
  }
  coins = coins.filter(c => !c.done);
  if (!coins.length) medalShown = save.medals;
  if (Math.random() < dt * 3) bubbles.push({ x: rand(0, W), y: FLOORY, r: rand(2, 6), v: rand(40, 90) });
  for (const b of bubbles) { b.y -= b.v * dt; b.x += Math.sin(T * 2 + b.r) * 0.4; }
  bubbles = bubbles.filter(b => b.y > SURF + 6);
  if (STAGES[stageIdx].deco === 'deep') for (const s of snow) { s.y += s.v * dt; s.x += Math.sin(T * 0.5 + s.s) * 0.2; if (s.y > H) { s.y = SURF + 10; s.x = rand(0, W); } }
  if (STAGES[stageIdx].deco === 'storm') {
    if (bolt) bolt.t -= dt;
    stormT -= dt;
    if (stormT <= 0) {
      stormT = rand(3, 8); bolt = { t: 0.35, x: rand(120, 640), seed: Math.floor(rand(0, 900)) };
      if (flash <= 0.1) { flash = 0.45; flashCol = '215,225,255'; }
      if (screen === 'fish') sfx.thunder();
    }
  }
}

function standPos() {

  const bob = boat ? Math.sin(T * 1.5) * (deco === 'storm' ? 10 : 4) : 0;
  return { boat, bob, x: 108, y: boat ? SURF - 18 + bob : SURF - 30 };
}
function computeRod() {

const _txt = {};

function updateHUD() {
  setT('medalNum', Math.max(0, Math.floor(medalShown)).toLocaleString());
  if (screen !== 'fish') return;
  const r = RODS[save.rod];
  setT('rodName', r.name);
  setT('rodCost', `${r.cost}枚 / 1回`);
  const cs = r.dist.map((p, i) => p >= 0.05 ? i + 1 : 0).filter(Boolean);

  const aim = fstate === 'aim';
  $('rodPrev').disabled = !aim; $('rodNext').disabled = !aim;
  setC('aimBottom', 'hidden', !!fight);
  setC('fightBottom', 'hidden', !fight);
  setC('fightTop', 'hidden', !fight);
  setC('feverBar', 'hidden', !(fever > 0));
  if (fever > 0) setT('feverT', Math.ceil(fever));
  $('btnBack').disabled = !(aim || fstate === 'escape');
  $('btnHelp').disabled = !aim;
  let hint = '';
  if (aim) hint = '海をタップしてルアーを投げよう！';
  else if (fstate === 'wait') hint = '魚が近づいてくる…';
  else if (fstate === 'hit') hint = '今だ！タップ！';
  else if (fight) hint = fight.mode === 'rage' || fight.mode === 'warn' ? 'あばれてる！ 手を止めて！' : fight.mode === 'chance' ? 'チャンス！ 連打！連打！' : fight.skill >= 100 ? '必殺ボタンが使える！' : '画面を連打してリールを巻け！';
  setT('hint', hint);

  if (fight) {
    setS('hpFill', 'width', clamp(fight.hp / fight.hpMax * 100, 0, 100).toFixed(1) + '%');
    setS('timeFill', 'width', clamp(fight.timer / fight.tmax * 100, 0, 100).toFixed(1) + '%');

  }
}

function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  if (screen !== 'fish') return;
  const p = toWorld(e);
  if (fstate === 'aim') { if (p.y > SURF + 20 && p.y < 1080) cast(p); }
  else if (fstate === 'wait') { if (target && target.delay > 0) { target.delay -= 0.3; lure.y += rand(-12, 12); } }
  else if (fstate === 'hit') startFight(true);
  else if (fstate === 'fight') reelTap(p.x, p.y);
});

}
btn('goAgain', () => { sfx.ui(); bgmStart(); showScreen('home'); });
btn('btnHelp', () => { if (fstate !== 'aim') return; sfx.ui(); openHelp(0); });
btn('hPrev', () => { if (helpPage > 0) { helpPage--; renderHelp(); sfx.ui(); } });
btn('hNext', () => { sfx.ui(); if (helpPage < HELP.length - 1) { helpPage++; renderHelp(); } else closeHelp(); });
btn('hClose', () => { sfx.ui(); closeHelp(); });
btn('tgBgm', () => { save.bgm = !save.bgm; saveGame(); applySound(); sfx.ui(); });
btn('tgSe', () => { save.se = !save.se; saveGame(); applySound(); sfx.ui(); });
btn('btnBack', () => {
  sfx.ui();
  if (screen === 'fish') { if (fstate !== 'aim' && fstate !== 'escape') return; fstate = 'aim'; lure.show = false; showScreen('stage'); }
  else showScreen('home');
});
btn('rodPrev', () => { if (fstate !== 'aim') return; save.rod = (save.rod + RODS.length - 1) % RODS.length; saveGame(); sfx.ui(); });
btn('rodNext', () => { if (fstate !== 'aim') return; save.rod = (save.rod + 1) % RODS.length; saveGame(); sfx.ui(); });
$('btnSkill').addEventListener('pointerdown', e => { e.stopPropagation(); audioInit(); useSkill(); });
btn('rOk', () => { sfx.ui(); closeResult(); });
btn('dClose', () => { sfx.ui(); $('detail').classList.add('hidden'); });
btn('dlgNo', () => { sfx.ui(); $('dialog').classList.add('hidden'); });
btn('dlgYes', () => { sfx.ui(); $('dialog').classList.add('hidden'); const f = dlgYes; dlgYes = null; if (f) f(); });
for (const id of ['result', 'dialog', 'detail', 'help', 'install']) $(id).addEventListener('pointerdown', e => e.stopPropagation());

// =====================================================================
//  ループ
// =====================================================================
resetStage();
applySound();
showScreen('title');
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  // 新しい版に入れ替わったら、一度だけ自動で読み直して最新にする
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
}
</script>
</body>
</html>
